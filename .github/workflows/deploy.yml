name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Astro 7 requires Node >= 22.12.0 — see .nvmrc and package.json engines.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the deployment if a document that config.mjs declares has gone
      # missing or become unreadable, instead of quietly publishing a site with
      # a hole in it.
      - name: Verify the documentation sources
        run: pnpm docs:check
        env:
          # There are no sibling checkouts on a runner, so this is what the sync
          # would pick anyway. Stated explicitly so a future default change
          # cannot silently switch the deployment to a different source.
          GLAND_DOCS_SOURCE: remote
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLAND_DEBUG: ''

      # `build` re-runs the sync itself; this step is here so the log shows what
      # was published even if the build fails afterwards.
      - name: Sync documentation from the repositories
        run: pnpm docs:sync:remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build
        env:
          # Turns on the framework's own startup logging during the build.
          GLAND_DEBUG: ''

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4